<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linux Studio – Miniatures YouTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F2FF;--ink:#17143F;--soft:#5D5A8A;--card:#fff;--line:#D9D5F5;--a1:#7C3AED;--a2:#FF3D8B;--a3:#FFC72C;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#100D2E;--ink:#F5F2FF;--soft:#AEA9DD;--card:#1B1750;--line:#34308A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#100D2E;--ink:#F5F2FF;--soft:#AEA9DD;--card:#1B1750;--line:#34308A;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden;
background:radial-gradient(60vmax 40vmax at 85% -5%,rgba(124,58,237,.38),transparent 70%),radial-gradient(50vmax 40vmax at -10% 28%,rgba(255,61,139,.26),transparent 70%),var(--bg)}
header{padding:44px 24px 22px;max-width:820px;margin:0 auto;text-align:center}
.brand{display:inline-flex;gap:8px;align-items:center;font-weight:800;padding:8px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--a2);box-shadow:0 0 12px var(--a2)}
h1{font-weight:800;font-size:clamp(2.5rem,10vw,5rem);line-height:.98;margin:22px 0 16px;letter-spacing:-.03em}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chips span{font-weight:800;font-size:.9rem;padding:7px 14px;border-radius:99px;background:var(--a3);color:#17143F}
.reel{overflow:hidden;padding:10px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;gap:16px;width:max-content;animation:slide 48s linear infinite}
.reel.rev .track{animation-direction:reverse;animation-duration:58s}
@keyframes slide{to{transform:translateX(-50%)}}
.thumb{flex:none;width:clamp(220px,64vw,330px);aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:2px solid rgba(255,255,255,.18);box-shadow:0 10px 26px rgba(23,20,63,.35)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
h2.t{text-align:center;font-size:clamp(1.6rem,6vw,2.4rem);font-weight:800;margin:40px 24px 6px;letter-spacing:-.02em}
.sub{text-align:center;color:var(--soft);margin:0 24px 22px}
.plans{display:grid;gap:14px;max-width:900px;margin:0 auto;padding:0 20px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.plan{all:unset;box-sizing:border-box;cursor:pointer;display:block;position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;transition:transform .15s,box-shadow .15s}
.plan:hover,.plan:focus-visible{transform:translateY(-4px);box-shadow:0 14px 30px rgba(124,58,237,.3);border-color:var(--a1)}
.plan b{font-size:1.25rem;font-weight:800}
.plan strong{display:block;font-size:2.6rem;font-weight:800;line-height:1.1;margin:6px 0;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.plan p{margin:0 0 14px;color:var(--soft)}
.plan .d{display:inline-block;font-weight:800;font-size:.85rem;padding:5px 12px;border-radius:99px;background:rgba(124,58,237,.14)}
.plan .go{display:block;margin-top:16px;font-weight:800;color:var(--a1)}
.plan.top{border:2px solid var(--a3);box-shadow:0 0 28px rgba(255,199,44,.35)}
.plan.top::after{content:"EXPRESS";position:absolute;top:-11px;right:18px;background:var(--a3);color:#17143F;font-weight:800;font-size:.72rem;padding:4px 10px;border-radius:99px}
footer{text-align:center;color:var(--soft);padding:36px 24px 44px;font-size:.9rem}
.ov{position:fixed;inset:0;background:rgba(10,8,30,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.open{display:flex}
.panel{background:var(--card);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:24px 22px calc(24px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;border:1px solid var(--line)}
@media (min-width:600px){.ov{align-items:center}.panel{border-radius:22px}}
.panel h3{margin:0 0 4px;font-size:1.5rem;font-weight:800}
.panel .meta{color:var(--soft);margin:0 0 16px}
label{display:block;font-weight:800;margin:12px 0 6px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:130px;resize:vertical}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font:inherit;font-weight:800;font-size:1.05rem;padding:14px;border-radius:14px;border:0;margin-top:14px;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--a1),var(--a2))}
.btn.alt{background:var(--a3);color:#17143F}
.btn.ghost{background:transparent;color:var(--soft);font-weight:500;margin-top:6px}
.err{color:var(--a2);font-weight:800;margin:8px 0 0;min-height:1.2em}
.sum{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;white-space:pre-wrap;color:var(--soft);margin:10px 0}
.x{float:right;all:unset;cursor:pointer;font-size:1.6rem;line-height:1;color:var(--soft);float:right}
.hide{display:none}
@media (prefers-reduced-motion:reduce){.track{animation:none}.reel{overflow-x:auto}.plan{transition:none}}
</style>
</head>
<body>
<header>
  <div class="brand"><i></i>Linux Studio</div>
  <h1>Des miniatures qui <em>font cliquer</em>.</h1>
  <div class="chips"><span>Dès 7,50 €</span><span>Livraison dès 12 h</span></div>
</header>

<section class="reel" aria-label="Exemples de miniatures"><div class="track" id="r1"></div></section>
<section class="reel rev" aria-label="Exemples de miniatures"><div class="track" id="r2"></div></section>

<h2 class="t">Choisis ton forfait</h2>
<p class="sub">Clique sur celui qu’il te faut.</p>
<section class="plans" id="plans"></section>
<footer>© Linux Studio</footer>

<div class="ov" id="ov">
  <div class="panel" role="dialog" aria-modal="true">
    <button class="x" id="x" aria-label="Fermer">×</button>
    <h3 id="mt"></h3>
    <p class="meta" id="mm"></p>
    <div id="s1">
      <label for="pseudo">Ton pseudo</label>
      <input id="pseudo" placeholder="Ex : Linux" autocomplete="off">
      <label for="mail">Ton e-mail (pour recevoir ta miniature)</label>
      <input id="mail" type="email" placeholder="toi@gmail.com" autocomplete="email">
      <label for="mail2">Confirme ton e-mail</label>
      <input id="mail2" type="email" placeholder="Retape-le pour être sûr" autocomplete="off">
      <label for="desc">Décris ta miniature</label>
      <textarea id="desc" placeholder="Titre, texte à écrire, couleurs, skin, ambiance, exemple que tu aimes…"></textarea>
      <p class="err" id="err"></p>
      <button class="btn" id="next">Continuer vers le paiement</button>
    </div>
    <div id="s2" class="hide">
      <div class="sum" id="sum"></div>
      <div id="pp" style="margin-top:14px"></div>
      <p class="err" id="perr"></p>
      <button class="btn ghost" id="back">← Modifier</button>
    </div>
    <div id="s3" class="hide">
      <h3>Merci, c’est payé ✅</h3>
      <p class="meta" id="done"></p>
      <button class="btn" id="fin">Fermer</button>
    </div>
  </div>
</div>

var PLANS=[["Echo",7.5,"4 à 5 jours","La miniature de base."],["Essentiel",15,"3 à 4 jours","Un visuel net et lisible."],["Standard",20,"2 à 3 jours","Plus de retouches et un texte soigné."],["Pro",30,"1 jour","Une miniature très travaillée."],["Ultime",40,"12 heures","Priorité absolue, résultat au top."]];
function eur(n){return(n%1?n.toFixed(2):String(n)).replace(".",",")+" €"}
function $(i){return document.getElementById(i)}
function fill(id,list){var h="";for(var k=0;k<2;k++){list.forEach(function(u){h+='<div class="thumb"><img src="'+u+'" alt="Miniature" loading="lazy"></div>'})}$(id).innerHTML=h}
fill("r1",P.slice(0,4));fill("r2",P.slice(4));
var cur=0;
$("plans").innerHTML=PLANS.map(function(p,i){return '<button class="plan'+(i==4?' top':'')+'" data-i="'+i+'"><b>'+p[0]+'</b><strong>'+eur(p[1])+'</strong><p>'+p[3]+'</p><span class="d">⏱ '+p[2]+'</span><span class="go">Choisir ce forfait →</span></button>'}).join("");
function show(s){$("s1").className=s==1?"":"hide";$("s2").className=s==2?"":"hide";$("s3").className=s==3?"":"hide"}
function openM(i){cur=i;var p=PLANS[i];$("mt").textContent="Forfait "+p[0]+" – "+eur(p[1]);$("mm").textContent="Livré en "+p[2];$("err").textContent="";show(1);$("ov").className="ov open"}
function closeM(){$("ov").className="ov"}
$("plans").addEventListener("click",function(e){var b=e.target.closest(".plan");if(b)openM(+b.getAttribute("data-i"))});
$("x").onclick=closeM;
$("ov").addEventListener("click",function(e){if(e.target===$("ov"))closeM()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeM()});
var msg="";
function loadPP(cb){
  if(window.paypal){cb();return}
  if(CONFIG.clientId.indexOf("TON")===0){$("perr").textContent="Le paiement n’est pas encore configuré.";return}
  var s=document.createElement("script");
  s.src="https://www.paypal.com/sdk/js?client-id="+CONFIG.clientId+"&currency=EUR&locale=fr_FR";
  s.onload=cb;
  s.onerror=function(){$("perr").textContent="Impossible de charger PayPal, réessaie."};
  document.head.appendChild(s)
}
function drawPP(){
  var p=PLANS[cur];$("pp").innerHTML="";
  paypal.Buttons({
    createOrder:function(d,a){return a.order.create({purchase_units:[{description:"Miniature "+p[0],amount:{currency_code:"EUR",value:p[1].toFixed(2)}}]})},
    onApprove:function(d,a){return a.order.capture().then(function(r){sendOrder(r.id)})},
    onError:function(){$("perr").textContent="Le paiement a échoué, réessaie."}
  }).render("#pp")
}
function sendOrder(id){
  var p=PLANS[cur];
  fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({access_key:CONFIG.formKey,subject:"Commande payée – "+p[0]+" ("+eur(p[1])+")",from_name:"Linux Studio",name:$("pseudo").value.trim()||"Sans pseudo",email:$("mail").value.trim().toLowerCase(),message:msg+"\n\nN° PayPal : "+id})})
  .then(function(r){if(!r.ok)throw 0;$("done").textContent="Ta commande est bien envoyée. Tu recevras ta miniature par e-mail dans les délais du forfait.";show(3)})
  .catch(function(){$("done").textContent="Paiement reçu, mais l’envoi a échoué. Note ce numéro PayPal et écris-moi : "+id;show(3)})
}
$("next").onclick=function(){
  var d=$("desc").value.trim(),n=$("pseudo").value.trim()||"Sans pseudo",m=$("mail").value.trim().toLowerCase(),m2=$("mail2").value.trim().toLowerCase(),p=PLANS[cur];
  if(!d){$("err").textContent="Décris ta miniature avant de continuer.";return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m)){$("err").textContent="Entre une adresse e-mail valide.";return}
  var dom=m.split("@")[1];
  if(["gmial.com","gmai.com","gmail.co","gmail.con","gmaill.com","gmil.com","gamil.com","gmail.fr"].indexOf(dom)>-1){$("err").textContent="Tu voulais dire gmail.com ? Vérifie ton adresse.";return}
  if(m!==m2){$("err").textContent="Les deux adresses e-mail sont différentes.";return}
  msg="Forfait : "+p[0]+" ("+eur(p[1])+", "+p[2]+")\nPseudo : "+n+"\nE-mail : "+m+"\n\nDescription :\n"+d;
  $("sum").textContent=msg;$("perr").textContent="";show(2);loadPP(drawPP)
};
$("fin").onclick=closeM;
$("back").onclick=function(){show(1)};
</script>
